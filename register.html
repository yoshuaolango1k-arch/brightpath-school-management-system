<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration | BrightPath School</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>body{font-family:'DM Sans',sans-serif}.display{font-family:'Manrope',sans-serif}</style></head>
<body class="min-h-screen bg-slate-50 px-4 py-10 text-slate-800">
<div class="mx-auto max-w-xl">
  <a href="index.php" class="mb-8 inline-flex items-center gap-3 font-bold"><span class="grid h-10 w-10 place-items-center rounded-xl bg-teal-600 text-white">B</span> BrightPath School</a>
  <div class="rounded-3xl border border-slate-100 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-10">
    <p class="text-sm font-bold uppercase tracking-widest text-teal-700">Student registration</p>
    <h1 class="display mt-2 text-3xl font-extrabold">Create your account</h1>
    <p class="mt-2 text-slate-500">Complete the form below to access your student portal.</p>
    <form action="register.php" method="POST" class="mt-8 space-y-5">
      <div><label class="mb-2 block text-sm font-semibold" for="full_name">Full name</label><input id="full_name" name="full_name" required maxlength="100" autocomplete="name" class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10" placeholder="Your full name"></div>
      <div><label class="mb-2 block text-sm font-semibold" for="email">Email address</label><input id="email" name="email" type="email" required maxlength="190" autocomplete="email" class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10" placeholder="you@example.com"></div>
      <div><label class="mb-2 block text-sm font-semibold" for="password">Password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10" placeholder="At least 8 characters"><p class="mt-1 text-xs text-slate-400">Use at least 8 characters.</p></div>
      <div><label class="mb-2 block text-sm font-semibold" for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10" placeholder="Enter the password again"></div>
      <button class="w-full rounded-xl bg-slate-900 px-5 py-3.5 font-bold text-white transition hover:bg-teal-700">Create student account</button>
    </form>
    <p class="mt-6 text-center text-sm text-slate-500">Already registered? <a href="index.php" class="font-bold text-teal-700 hover:underline">Sign in</a></p>
  </div>
  <p class="mt-6 text-center text-xs text-slate-400">BrightPath School · Student Portal</p>
</div>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  if (password !== confirm) { e.preventDefault(); alert('The passwords do not match.'); }
});
</script>
</body></html>
